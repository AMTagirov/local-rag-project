experiment_name: "retrieval_optimization"
base_config: "src/config/config.yaml"
dataset: "golden_dataset.json"
output_dir: "experiment_results"
collection_name: "my_knowledge_base"

# Эти параметры не требуют переиндексации: коллекция остаётся одной и той же.
runs:
  - name: "hybrid_k4"
    search_mode: "hybrid"
    top_n_retrieval: 50
    top_k: 4
    use_reranker: true

  - name: "hybrid_k6"
    search_mode: "hybrid"
    top_n_retrieval: 50
    top_k: 6
    use_reranker: true

  - name: "hybrid_k10"
    search_mode: "hybrid"
    top_n_retrieval: 50
    top_k: 10
    use_reranker: true

  - name: "dense_k6"
    search_mode: "dense"
    top_n_retrieval: 50
    top_k: 6
    use_reranker: true

  - name: "sparse_k6"
    search_mode: "sparse"
    top_n_retrieval: 50
    top_k: 6
    use_reranker: true

  - name: "hybrid_without_reranker"
    search_mode: "hybrid"
    top_n_retrieval: 10
    top_k: 10
    use_reranker: false

  - name: "qr_baseline"
    search_mode: "hybrid"
    top_n_retrieval: 50
    top_k: 6
    use_reranker: true
    use_query_rewriting: false

  - name: "qr_rewrite_only"
    search_mode: "hybrid"
    top_n_retrieval: 50
    top_k: 6
    use_reranker: true
    use_query_rewriting: true
    keep_original_query: false
    query_rrf_k: 60

  - name: "qr_original_plus_rewrite"
    search_mode: "hybrid"
    top_n_retrieval: 50
    top_k: 6
    use_reranker: true
    use_query_rewriting: true
    keep_original_query: true
    query_rrf_k: 60
