# Основные настройки эксперимента
experiment_name: "rag_with_reranking_test_top_k=4"
parser_type: "auto"  # auto выбирает PDF/DOCX-парсер по расширению файла
top_k: 10  # Сколько финальных результатов мы хотим получить на выходе

# Настройки эмбеддингов
embedding:
  model_name: "intfloat/multilingual-e5-large"
  dimension: 1024

# Настройки LLM (Ollama)
llm:
  model_name: "qwen2.5:14b"
  base_url: "http://localhost:11434"
  num_ctx: 16384
  temperature: 0.0                    # Полностью убирает случайность
  top_p: 1.0                          # Отключает стороннюю фильтрацию токенов
  seed: 42     

# Настройки разбиения текста
splitter:
  chunk_size: 1800
  chunk_min_size: 500                 # Короткие соседние чанки объединяются до этого размера
  chunk_overlap: 400
  strategy: "semantic"                # Или "recursive" для старого режима
  breakpoint_percentile_threshold: 90 # Порог деления тем
  block_size: 128                     # Пачка для стриминга против OOM

# Настройки векторной базы данных
vector_store:
  host: "localhost"
  port: 6333
  collection_name: "my_knowledge_base"
  docs_dir: "data/docs"           
  recreate_on_start: true
  search_mode: "hybrid"   

#  Настройки реранкера 
reranker:
  model_name: "BAAI/bge-reranker-v2-m3" # Мультиязычный Cross-Encoder
  use_reranker: true                  # Включить или выключить этап переранжирования
  top_n_retrieval: 50                # Сколько документов достать из Qdrant для анализа реранкером

# Опциональное уточнение пользовательского запроса перед поиском
query_rewriting:
  enabled: false                     # true включает дополнительный вызов LLM
  keep_original: true                # Искать по исходному и переписанному запросам
  rrf_k: 60                          # Параметр объединения двух выдач через RRF

document_analysis:
  enabled: false
  device: "cpu"
  engine: "onnxruntime"
  ocr_language: "ru"
  ocr_version: "PP-OCRv5"
  prefer_native_pdf_text: true
  native_text_min_chars: 80
  use_formula_recognition: false
  formula_model_name: "PP-FormulaNet_plus-M"
  formula_filter_enabled: true
  formula_filter_threshold: 2
  formula_render_dpi: 250
  # Формулы + таблицы одновременно требуют много RAM; включайте по задаче.
  use_table_recognition: false
  use_chart_recognition: false
  save_images: true
  assets_dir: "data/extracted"
  cache_dir: "data/models/paddlex"
