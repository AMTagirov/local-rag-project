# Основные настройки эксперимента
experiment_name: "demonstration"
parser_type: "auto"
top_k: 10  # Сколько финальных результатов мы хотим получить на выходе

# Настройки эмбеддингов
embedding:
  model_name: "intfloat/multilingual-e5-large"
  dimension: 1024

# Настройки LLM (Ollama)
llm:
  model_name: "qwen2.5:14b"
  base_url: "http://localhost:11434"
  num_ctx: 8192
  temperature: 0.0                    # Полностью убирает случайность
  top_p: 1.0                          # Отключает стороннюю фильтрацию токенов
  seed: 42     

# Настройки разбиения текста
splitter:
  chunk_size: 1800
  chunk_min_size: 500
  chunk_overlap: 400
  strategy: "semantic"
  breakpoint_percentile_threshold: 90 # Порог деления тем
  block_size: 128                     # Пачка для стриминга против OOM

# Настройки векторной базы данных
vector_store:
  host: "localhost"
  port: 6333
  collection_name:   "patent_doc_test" #"my_knowledge_base"
  docs_dir: "data/docs"           
  recreate_on_start: true
  search_mode: "hybrid"   

#  Настройки реранкера 
reranker:
  model_name: "BAAI/bge-reranker-v2-m3" # Модель Cross-Encoder (скачается автоматически)
  use_reranker: true                  # Включить или выключить этап переранжирования
  top_n_retrieval: 50                # Сколько документов достать из Qdrant для анализа реранкером

# Опциональное уточнение пользовательского запроса перед поиском
query_rewriting:
  enabled: false                    # Включается только в специальных QR-экспериментах
  keep_original: true                # Искать по исходному и переписанному запросам
  rrf_k: 60                          # Параметр объединения двух выдач через RRF

document_analysis:
  enabled: false                    # Базовый PyMuPDF/DOCX-парсер без OCR
